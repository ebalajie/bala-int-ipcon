# ---- Global Chart Values ----
replicaCount: 2

image:
  repository: balaji541/bala-int-ipcon
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

# AWS LoadBalancer Annotations
serviceAnnotations:
  service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
  service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/healthz"
  service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "8000"
  service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: "HTTP"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# ---- Liveness & Readiness Probes ----
livenessProbe:
  enabled: true
  path: /healthz
  port: 8000
  initialDelaySeconds: 3
  periodSeconds: 10

readinessProbe:
  enabled: true
  path: /healthz
  port: 8000
  initialDelaySeconds: 3
  periodSeconds: 10

# ---- Security Context ----
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---- Autoscaling ----
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# ---- Ingress (Disabled) ----
ingress:
  enabled: false

# ---- Helm tests ----
tests:
  enabled: true
