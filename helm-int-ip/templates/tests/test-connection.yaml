apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ipconfig-service.fullname" . }}-test-connection"
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: curlimages/curl:latest
      command:
        - "curl"
        - "-f"
        - "http://{{ include "ipconfig-service.fullname" . }}:{{ .Values.service.port }}/ipconfig"
  restartPolicy: Never
